<!DOCTYPE html<
<head>
<title>login page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style> /*internal css*/

body {
    font-family: Arial, sans-serif;
    display: flex;
    background: linear-gradient(to right, #02343F, #F0EDCC);
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
}

.login-container {
    background: white;
    padding: 30px;
    border-radius: 8px;
    width: 100%;
    max-width: 400px;
    box-sizing: border-box;
}

h2 {
    text-align: center;
    color: #333;
    margin-bottom: 25px;
}

form {
    width: 100%;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 18px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
}

.login-btn {
    width: 100%;
    padding: 12px;
    background-color: #02343F;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
}

.login-btn:hover {
    background-color: #0056b3;
}
</style>

</head>

<body>
<div class="login-container">
<h2>login</h2>
<form>

    <label>Username</label>
    <input type="text" id="username" placeholder="Enter Username">

    <label>Password</label>
    <input type="password" placeholder="Enter password">

    <button type="submit" class="login-btn">Login</button>

</form>
</body>
</html>
